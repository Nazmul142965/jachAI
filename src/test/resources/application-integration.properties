# Integration test profile for real MongoDB tests
# This profile enables MongoDB but requires MONGODB_TEST_URI to be set
# MONGODB_TEST_URI must point to a dedicated database beginning with "jachai_it_"
# Never use MONGODB_URI or the application database for integration tests
spring.data.mongodb.uri=${MONGODB_TEST_URI}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=test-only-32-byte-key-for-jachai-integration-tests-123456
