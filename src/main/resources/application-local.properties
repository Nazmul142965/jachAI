# The application runs on this workstation, but MongoDB is hosted in Atlas.
# Use MONGODB_URI for cluster/authentication; keep the database name outside it.
spring.data.mongodb.database=${LOCAL_MONGODB_DATABASE:jachai_dev}

# Local development uses the same database for the normal account and the
# disposable demo identities requested on the sign-in page.
app.demo.public-access=true
app.demo.shared-database=true
