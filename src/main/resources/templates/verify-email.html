<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email · JachAI</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f5f7fb; color: #172033; margin: 0; }
    main { max-width: 30rem; margin: 12vh auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 12px 35px #17304a15; }
    h1 { margin-top: 0; }
  </style>
</head>
<body>
  <main>
    <h1>JachAI email verification</h1>
    <p id="status" role="status">Checking your verification link…</p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    // Remove the one-time token from browser history before the API request.
    history.replaceState(null, '', location.pathname);
    const status = document.getElementById('status');
    if (!token) {
      status.textContent = 'This verification link is incomplete.';
    } else {
      fetch('/api/v1/auth/verify-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      }).then(response => {
        status.textContent = response.ok
          ? 'Your email is verified. You can now sign in.'
          : 'This link is invalid or has expired. Request a new verification email.';
      }).catch(() => {
        status.textContent = 'Could not reach JachAI. Please try again.';
      });
    }
  </script>
</body>
</html>
