<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · JachAI</title>
  <style>
    body { font: 16px/1.5 'Segoe UI', system-ui, sans-serif; background: #f4f8f5; color: #182d32; margin: 0; }
    main { max-width: 30rem; margin: 10vh auto; padding: 2rem; background: #fff; border: 1px solid #d9e5e1; border-radius: 1rem; box-shadow: 0 12px 35px #12413915; }
    h1 { margin-top: 0; }
    .muted { color: #657879; }
    label { display: block; margin-bottom: .5rem; font-weight: 700; font-size: .9rem; }
    input { width: 100%; box-sizing: border-box; padding: .8rem; font: inherit; border: 1px solid #c8d7d0; border-radius: .5rem; }
    input:focus-visible { outline: 3px solid #075b4d; outline-offset: 2px; }
    button { margin-top: 1rem; padding: .8rem 1.2rem; border: 0; border-radius: .5rem; background: #075b4d; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #075b4d; outline-offset: 2px; }
    a { color: #075b4d; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <form id="reset-form">
      <input type="email" name="username" autocomplete="username" hidden aria-hidden="true" tabindex="-1">
      <label for="password">New password (at least 12 characters)</label>
      <input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <button type="submit">Reset password</button>
    </form>
    <section id="request" hidden>
      <p class="muted">Enter your account email and JachAI will queue a reset link if the account is eligible.
        This page cannot confirm delivery.</p>
      <form id="request-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <button type="submit">Send reset link</button>
      </form>
    </section>
    <p id="status" role="status"></p>
    <p><a href="/">Back to sign in</a></p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    history.replaceState(null, '', location.pathname);
    const form = document.getElementById('reset-form');
    const request = document.getElementById('request');
    const status = document.getElementById('status');
    const showRequest = () => { request.hidden = false; };
    if (!token) {
      form.hidden = true;
      status.textContent = 'No reset token in this link. Request a new reset email below.';
      showRequest();
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.getElementById('password').value;
      try {
        const response = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        if (response.ok) {
          form.hidden = true;
          status.textContent = 'Password reset. You can now sign in.';
        } else {
          status.textContent = 'This link is invalid or expired. Request a new reset email below.';
          showRequest();
        }
      } catch (_) {
        status.textContent = 'Could not reach JachAI. Please try again.';
      }
    });
    document.getElementById('request-form').addEventListener('submit', async event => {
      event.preventDefault();
      const email = document.getElementById('email').value;
      try {
        const response = await fetch('/api/v1/auth/request-password-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const body = await response.json().catch(() => null);
        status.textContent = response.ok
          ? (body?.message || 'If the account is eligible, a reset email has been queued.')
          : 'Could not request a reset email. Try again in a few minutes.';
      } catch (_) {
        status.textContent = 'Could not reach JachAI. Please try again.';
      }
    });
  </script>
</body>
</html>
