# Disposable demo profile. Shared-database mode remains opt-in and is intended
# only for an explicitly isolated demo workspace namespace.
# Remote faculty previews require SERVER_ADDRESS=0.0.0.0, DEMO_PUBLIC_ACCESS=true,
# APP_PUBLIC_BASE_URL=https://... and a dedicated jachai_demo_* database.
server.address=${SERVER_ADDRESS:127.0.0.1}
app.demo.public-access=${DEMO_PUBLIC_ACCESS:false}
app.demo.shared-database=${DEMO_SHARED_DATABASE:false}
server.forward-headers-strategy=none
spring.data.mongodb.database=${DEMO_MONGODB_DATABASE:jachai_demo_local}
spring.ai.model.chat=none
app.ai.tutor-provider=none
app.security.rate-limit.enabled=false
