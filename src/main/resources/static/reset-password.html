<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password · JachAI</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f5f7fb; color: #172033; margin: 0; }
    main { max-width: 30rem; margin: 10vh auto; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 12px 35px #17304a15; }
    h1 { margin-top: 0; }
    label { display: block; margin-bottom: .5rem; }
    input { width: 100%; box-sizing: border-box; padding: .8rem; font: inherit; border: 1px solid #8794a8; border-radius: .5rem; }
    button { margin-top: 1rem; padding: .8rem 1.2rem; border: 0; border-radius: .5rem; background: #164ec0; color: white; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <form id="reset-form">
      <label for="password">New password (at least 12 characters)</label>
      <input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <button type="submit">Reset password</button>
    </form>
    <p id="status" role="status"></p>
  </main>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    history.replaceState(null, '', location.pathname);
    const form = document.getElementById('reset-form');
    const status = document.getElementById('status');
    if (!token) {
      form.hidden = true;
      status.textContent = 'This reset link is incomplete.';
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.getElementById('password').value;
      try {
        const response = await fetch('/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        if (response.ok) {
          form.hidden = true;
          status.textContent = 'Password reset. You can now sign in.';
        } else {
          status.textContent = 'This link is invalid or expired. Request a new reset email.';
        }
      } catch (_) {
        status.textContent = 'Could not reach JachAI. Please try again.';
      }
    });
  </script>
</body>
</html>
