# Production configuration — all values from environment/secret manager
# Database: cluster + credentials only; NO database name in MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:jachai_prod}

# JWT: at least 32 random bytes, stable across restarts
app.jwt.secret=${JWT_SECRET}

# Redis: required for rate limits, revocation cache, AI quotas, published version cache
# Use SPRING_DATA_REDIS_URL (redis://user:pass@host:port) OR individual settings:
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
management.health.redis.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo,redis

# Cache & revocation (enabled by default in prod)
app.cache.published-versions.enabled=${CACHE_ENABLED:true}
app.security.redis-revocation.enabled=${REDIS_REVOCATION_ENABLED:true}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# SMTP: required for email delivery (verification, reset, notifications)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM}
# Separate encryption key for queued email payloads (recommended)
app.mail.job.encryption.key=${MAIL_JOB_ENCRYPTION_KEY:}

# Public HTTPS origin — required for OAuth redirects, payment callbacks, email links
app.public.base-url=${APP_PUBLIC_BASE_URL}

# Trusted reverse proxy CIDRs for client IP resolution (comma-separated IPv4/IPv6)
# Empty by default = socket peer only; set ONLY the load balancer/proxy addresses
app.security.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}

# Optional provider settings (features remain disabled until configured)
# Google OAuth Web client ID (authorized JavaScript origin = APP_PUBLIC_BASE_URL)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
# AI providers
app.ai.provider=${AI_PROVIDER:none}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.tutor.provider=${AI_TUTOR_PROVIDER:none}
app.ai.tutor.groq.api-key=${GROQ_API_KEY:}
app.ai.tutor.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
app.ai.tutor.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.ai.ollama.base-url=${OLLAMA_BASE_URL:}
app.ai.ollama.model=${OLLAMA_MODEL:}
spring.ai.retry.max-attempts=2

# Sandbox payment gateways (NEVER live credentials)
# SSLCOMMERZ
app.billing.sslcommerz.sandbox.store-id=${SSLCOMMERZ_SANDBOX_STORE_ID:}
app.billing.sslcommerz.sandbox.store-password=${SSLCOMMERZ_SANDBOX_STORE_PASSWORD:}
# Direct bKash tokenized sandbox
app.billing.bkash.sandbox.app-key=${BKASH_SANDBOX_APP_KEY:}
app.billing.bkash.sandbox.app-secret=${BKASH_SANDBOX_APP_SECRET:}
app.billing.bkash.sandbox.username=${BKASH_SANDBOX_USERNAME:}
app.billing.bkash.sandbox.password=${BKASH_SANDBOX_PASSWORD:}
# Demo TEAM price (BDT)
app.billing.demo-team-price-bdt=${DEMO_TEAM_PRICE_BDT:100.00}

# Support center public display (optional)
app.support.email=${SUPPORT_EMAIL:}
app.support.phone=${SUPPORT_PHONE:}
app.support.whatsapp-number=${SUPPORT_WHATSAPP_NUMBER:}

# Actuator: only health exposed; details hidden from anonymous
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
