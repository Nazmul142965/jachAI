spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:jachai_prod}
app.jwt.secret=${JWT_SECRET}
management.health.redis.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo,redis
app.cache.published-versions.enabled=${CACHE_ENABLED:true}
app.security.redis-revocation.enabled=${REDIS_REVOCATION_ENABLED:true}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM}
