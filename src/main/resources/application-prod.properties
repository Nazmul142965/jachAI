# Production configuration — all values from environment/secret manager
# Database: cluster + credentials only; NO database name in MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:jachai_prod}

# JWT: at least 32 random bytes, stable across restarts
app.jwt.secret=${JWT_SECRET}

# Redis: required for rate limits, revocation cache, AI quotas, published version cache
# Use SPRING_DATA_REDIS_URL (redis://user:pass@host:port) OR individual settings.
# The empty default is what makes that "OR" true: with ${REDIS_HOST} and no default,
# binding threw on the unresolved placeholder even when the URL was supplied, so the
# documented alternative could not actually be used. RequiredSettingsGuard refuses to
# start when neither arrives, which is the check this default would otherwise lose.
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
management.health.redis.enabled=true
management.endpoint.health.group.readiness.include=readinessState,mongo,redis

# Cache & revocation (enabled by default in prod)
app.cache.published-versions.enabled=${CACHE_ENABLED:true}
app.security.redis-revocation.enabled=${REDIS_REVOCATION_ENABLED:true}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# SMTP: required for email delivery (verification, reset, notifications)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM}
# Separate encryption key for queued email payloads (recommended)
app.mail.job-encryption-key=${MAIL_JOB_ENCRYPTION_KEY:${app.jwt.secret}}

# Public HTTPS origin — required for OAuth redirects, payment callbacks, email links
app.public-base-url=${APP_PUBLIC_BASE_URL}
# Optional shared production deployment demo. Keep both flags false unless the
# six demo identities/workspaces are intentionally enabled in this database.
app.demo.public-access=${DEMO_PUBLIC_ACCESS:false}
app.demo.shared-database=${DEMO_SHARED_DATABASE:false}

# Trusted reverse proxy CIDRs for client IP resolution (comma-separated IPv4/IPv6)
# Empty by default = socket peer only; set ONLY the load balancer/proxy addresses
app.security.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}

# Optional provider settings (features remain disabled until configured)
# Google OAuth Web client ID (authorized JavaScript origin = APP_PUBLIC_BASE_URL)
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
# AI providers
spring.ai.model.chat=${AI_PROVIDER:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.tutor-provider=${AI_TUTOR_PROVIDER:${AI_PROVIDER:none}}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
# If the chosen AI provider fails or is slow, a second configured provider answers instead.
# auto = the other hosted provider when its key is set; none = off; or a provider name.
app.ai.question-fallback=${AI_QUESTION_FALLBACK:auto}
app.ai.tutor-fallback=${AI_TUTOR_FALLBACK:auto}
app.ai.primary-timeout-seconds=${AI_PRIMARY_TIMEOUT_SECONDS:25}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.retry.max-attempts=2

# Sandbox payment gateways (NEVER live credentials)
# SSLCOMMERZ
app.billing.sslcommerz.store-id=${SSLCOMMERZ_SANDBOX_STORE_ID:}
app.billing.sslcommerz.store-password=${SSLCOMMERZ_SANDBOX_STORE_PASSWORD:}
# Direct bKash tokenized sandbox
app.billing.bkash.app-key=${BKASH_SANDBOX_APP_KEY:}
app.billing.bkash.app-secret=${BKASH_SANDBOX_APP_SECRET:}
app.billing.bkash.username=${BKASH_SANDBOX_USERNAME:}
app.billing.bkash.password=${BKASH_SANDBOX_PASSWORD:}
# Demo TEAM price (BDT)
app.billing.demo-team-price-bdt=${DEMO_TEAM_PRICE_BDT:100.00}

# Support center public display (optional)
app.support.email=${SUPPORT_EMAIL:}
app.support.phone=${SUPPORT_PHONE:}
app.support.whatsapp-number=${SUPPORT_WHATSAPP_NUMBER:}

# Actuator: only health exposed; details hidden from anonymous
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
