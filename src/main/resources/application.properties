spring.application.name=jachAI
# Keep HttpServletRequest.getRemoteAddr() as the raw socket peer for trusted-proxy checks.
server.forward-headers-strategy=none
app.security.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}
spring.profiles.default=local
# Credentials come from environment variables supplied by the run configuration.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
app.jwt.secret=${JWT_SECRET}
app.platform.admin-user-ids=${PLATFORM_ADMIN_USER_IDS:}
app.platform.storage-warning-bytes=${ATLAS_STORAGE_WARNING_BYTES:400000000}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.practice.ai-global-daily-limit=${PRACTICE_AI_GLOBAL_DAILY_LIMIT:100}
app.billing.demo-team-price-bdt=${DEMO_TEAM_PRICE_BDT:100.00}
app.billing.sslcommerz.store-id=${SSLCOMMERZ_SANDBOX_STORE_ID:}
app.billing.sslcommerz.store-password=${SSLCOMMERZ_SANDBOX_STORE_PASSWORD:}
app.billing.bkash.app-key=${BKASH_SANDBOX_APP_KEY:}
app.billing.bkash.app-secret=${BKASH_SANDBOX_APP_SECRET:}
app.billing.bkash.username=${BKASH_SANDBOX_USERNAME:}
app.billing.bkash.password=${BKASH_SANDBOX_PASSWORD:}
app.mail.job-encryption-key=${MAIL_JOB_ENCRYPTION_KEY:${app.jwt.secret}}
app.mail.outbox.poll-ms=${MAIL_OUTBOX_POLL_MS:15000}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
# The URI supplies Atlas cluster and credentials, not the application database.
# Profiles select separate database names in application-local/prod.properties.
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.auto-index-creation=true

# The driver logs its full MongoClientSettings at INFO on startup, and that dump
# contains the database username and the cluster host. The password is masked,
# the username is not. Raising these two loggers keeps credentials out of the
# console, CI output and any log anyone pastes into a chat. Warnings and
# connection failures are still reported.
logging.level.org.mongodb.driver.client=WARN
logging.level.org.mongodb.driver.cluster=WARN
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
app.security.redis-revocation.enabled=${REDIS_REVOCATION_ENABLED:false}
app.cache.published-versions.enabled=${CACHE_ENABLED:false}
management.health.redis.enabled=${CACHE_ENABLED:false}
spring.ai.model.chat=${AI_PROVIDER:none}
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3.2}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.tutor-provider=${AI_TUTOR_PROVIDER:${AI_PROVIDER:none}}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.ai.retry.max-attempts=2
